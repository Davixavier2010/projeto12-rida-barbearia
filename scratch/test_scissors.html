<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste Tesoura Splash</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #070a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .splash-container {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scissors-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(197, 160, 89, 0.3));
  }

  .scissor-half {
    transform-origin: 120px 120px;
    will-change: transform;
  }

  /* Animação com ritmo natural de corte de barbeiro profissional */
  .half-top {
    animation: cutSnipTop 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .half-bottom {
    animation: cutSnipBottom 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  @keyframes cutSnipTop {
    0% {
      transform: rotate(0deg);
    }
    18% {
      transform: rotate(-24deg); /* abre bem */
    }
    34% {
      transform: rotate(2deg); /* primeiro corte firme (snip!) */
    }
    48% {
      transform: rotate(-16deg); /* abre intermediário */
    }
    64% {
      transform: rotate(1deg); /* segundo corte preciso (snip!) */
    }
    78% {
      transform: rotate(-5deg); /* pequeno recuo natural */
    }
    90%, 100% {
      transform: rotate(0deg); /* fecha elegante em repouso */
    }
  }

  @keyframes cutSnipBottom {
    0% {
      transform: rotate(0deg);
    }
    18% {
      transform: rotate(24deg); /* abre bem */
    }
    34% {
      transform: rotate(-2deg); /* primeiro corte firme (snip!) */
    }
    48% {
      transform: rotate(16deg); /* abre intermediário */
    }
    64% {
      transform: rotate(-1deg); /* segundo corte preciso (snip!) */
    }
    78% {
      transform: rotate(5deg); /* pequeno recuo natural */
    }
    90%, 100% {
      transform: rotate(0deg); /* fecha elegante em repouso */
    }
  }

  /* Brilho da Lâmina ao fechar */
  .blade-gleam {
    animation: gleamPulse 1.4s ease forwards;
  }

  @keyframes gleamPulse {
    0%, 60% { opacity: 0; }
    70% { opacity: 0.8; }
    100% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="splash-container">
  <svg class="scissors-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradiente Ouro Realista Premium -->
      <linearGradient id="goldBladeGrad" x1="120" y1="120" x2="215" y2="120" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#C5A059" />
        <stop offset="35%" stop-color="#F5E4B5" />
        <stop offset="70%" stop-color="#C5A059" />
        <stop offset="100%" stop-color="#8E6F33" />
      </linearGradient>

      <!-- Gradiente para o Corpo e Cabos -->
      <linearGradient id="goldBodyGrad" x1="40" y1="60" x2="160" y2="180" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F2D898" />
        <stop offset="50%" stop-color="#C5A059" />
        <stop offset="100%" stop-color="#735520" />
      </linearGradient>

      <!-- Gradiente do Fio de Corte Afiado -->
      <linearGradient id="edgeGrad" x1="120" y1="120" x2="215" y2="120" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#F7EAC7" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
      </linearGradient>
    </defs>

    <!-- METADE SUPERIOR (Lâmina superior + Haste + Anel com Descanso de Dedo) -->
    <g class="scissor-half half-top">
      <!-- Corpo da lâmina superior com chanfro -->
      <path d="M 120 120 L 212 120 C 205 113 172 108 120 114 Z" fill="url(#goldBladeGrad)" />
      <!-- Fio de corte afiado superior -->
      <path d="M 120 120 L 212 120" stroke="url(#edgeGrad)" stroke-width="1.8" stroke-linecap="round" />
      <!-- Haste superior elegante -->
      <path d="M 120 116 C 102 122 84 140 68 150" stroke="url(#goldBodyGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Anel de Dedo Superior (Finger Ring) -->
      <circle cx="54" cy="160" r="17" stroke="url(#goldBodyGrad)" stroke-width="4.5" fill="none" />
      <!-- Descanso de Dedo Curvo Estilo Barbeiro (Tang) -->
      <path d="M 40 170 C 30 180 26 191 32 195 C 38 197 44 190 48 178" stroke="url(#goldBodyGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- METADE INFERIOR (Lâmina inferior + Haste + Anel de Polegar) -->
    <g class="scissor-half half-bottom">
      <!-- Corpo da lâmina inferior com chanfro -->
      <path d="M 120 120 L 212 120 C 205 127 172 132 120 126 Z" fill="url(#goldBladeGrad)" />
      <!-- Fio de corte afiado inferior -->
      <path d="M 120 120 L 212 120" stroke="url(#edgeGrad)" stroke-width="1.8" stroke-linecap="round" />
      <!-- Haste inferior elegante -->
      <path d="M 120 124 C 102 118 84 100 68 90" stroke="url(#goldBodyGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Anel de Polegar (Thumb Ring) -->
      <circle cx="54" cy="80" r="17" stroke="url(#goldBodyGrad)" stroke-width="4.5" fill="none" />
    </g>

    <!-- PIVÔ CENTRAL (Parafuso Regulador de Precisão) -->
    <circle cx="120" cy="120" r="8" fill="#0C121E" stroke="url(#goldBodyGrad)" stroke-width="3" />
    <circle cx="120" cy="120" r="3.5" fill="#F2D898" />
    <!-- Brilho de corte final -->
    <circle cx="170" cy="120" r="6" fill="#FFF8E0" class="blade-gleam" filter="drop-shadow(0 0 6px #F2D898)" />
  </svg>
</div>

</body>
</html>
